name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: abha_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/abha_portal_test"
      JWT_SECRET: "test-secret-that-is-at-least-32-characters-long-for-testing"
      SESSION_HOURS: 8
      ABHA_PROVIDER: "mock"
      ABHA_DEV_OTP: "123456"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations and seed
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Run code checks (typecheck, lint, vitest)
        run: npm run check

      - name: Build Next.js application
        run: npm run build
